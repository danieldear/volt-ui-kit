[package]
name = "volt-ui-kit-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Experimental shared Rust application host and reusable iOS/Android adapters for Volt UI Kit"

[dependencies]
volt-ui-kit = { path = "../..", features = ["mobile"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.21.1", default-features = false }
ndk-sys = "=0.6.0"
raw-window-handle = "=0.6.2"
