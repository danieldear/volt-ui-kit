[package]
name = "volt-ui-kit-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Experimental Rust/WASM canvas host for Volt UI Kit"

[features]
default = []
gpu = ["volt-ui-kit/rendering-gpu"]

[dependencies]
volt-ui-kit = { path = "../..", features = ["rendering"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData"] }
