[package]
name = "volt-ui-kit-security"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Opt-in secure storage, device-owner confirmation and Sign in with Apple for Volt UI Kit apps"

# The macOS bindings call Apple's C and Objective-C APIs, which needs unsafe
# code. It lives here so volt-ui-kit keeps forbidding unsafe code, and so only
# apps that want these services download the bindings. Other platforms build
# and report `Unsupported`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSPersonNameComponents", "NSString"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFData", "CFDictionary", "CFError", "CFNumber", "CFString"] }
objc2-security = { version = "=0.3.2", default-features = false, features = ["std", "SecBase", "SecItem", "SecTask"] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LABiometryType"] }
objc2-authentication-services = { version = "=0.3.2", default-features = false, features = ["std", "block2", "ASAuthorization", "ASAuthorizationAppleIDCredential", "ASAuthorizationAppleIDProvider", "ASAuthorizationAppleIDRequest", "ASAuthorizationController", "ASAuthorizationCredential", "ASAuthorizationError", "ASAuthorizationOpenIDRequest", "ASAuthorizationRequest", "ASFoundation"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }

[dev-dependencies]
# The windowed demo only; apps depend on volt-ui-kit themselves.
volt-ui-kit = { path = "../..", features = ["native"] }
