name: WebAssembly prototype
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Line numbers without full debug info: smaller, quicker builds to cache.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Build Rust on the runner (which has a C compiler), then run browsers
      # in this matching image with fonts/dependencies already installed.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      # Compiled dependencies and downloads from earlier runs on this branch
      # (or main). Saved again at the end, even when a later step fails.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/wasm-bindgen
            target/
            crates/volt-ui-kit-web/target/
            examples/web/target/
          key: web-noble-pw1.62.1-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', '.github/workflows/web-prototype.yml') }}
          restore-keys: web-noble-pw1.62.1-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: cargo test --locked --manifest-path crates/volt-ui-kit-web/Cargo.toml
      - run: cargo test --locked --manifest-path examples/web/Cargo.toml --lib
      - run: cargo clippy --locked --manifest-path crates/volt-ui-kit-web/Cargo.toml --target wasm32-unknown-unknown --features gpu -- -D warnings
      - name: Install wasm-bindgen (kept in the cache)
        run: wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.129' || cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: python3 scripts/build_web.py
      - run: npm install --prefix target/web-test-tools --no-save --ignore-scripts playwright@1.62.1
      - name: Real browser smoke tests in the pinned runtime
        shell: bash
        run: |
          rm -rf target/web-pages/volt-ui-kit
          python3 scripts/build_docs_site.py target/web-pages/volt-ui-kit --web-assets docs/live/pkg
          docker run --rm --interactive --shm-size=1g \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" --workdir "$PWD" \
            --env HOME=/tmp --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env NODE_PATH="$PWD/target/web-test-tools/node_modules" \
            "$PLAYWRIGHT_IMAGE" /bin/bash -euo pipefail -s <<'BROWSER_TESTS'
          NODE_PATH="$PWD/target/web-test-tools/node_modules" node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          assert.equal(require('playwright/package.json').version, '1.62.1');
          assert.ok(fs.existsSync(require('playwright').chromium.executablePath()), 'Pinned Chromium is missing');
          JS
          # The browser image includes Node, but does not promise Python/build tools.
          node - <<'SERVER' > target/web-server.log 2>&1 &
          const http = require('node:http'), fs = require('node:fs'), path = require('node:path');
          const root = path.resolve('target/web-pages');
          const types = {'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm',
            '.css':'text/css','.json':'application/json','.svg':'image/svg+xml',
            '.png':'image/png','.jpg':'image/jpeg','.woff2':'font/woff2','.ttf':'font/ttf'};
          http.createServer((req, res) => {
            if (!['GET','HEAD'].includes(req.method)) { res.writeHead(405).end(); return; }
            let name;
            try { name = decodeURIComponent(new URL(req.url, 'http://localhost').pathname); }
            catch { res.writeHead(400).end(); return; }
            const file = path.resolve(root, '.' + name, name.endsWith('/') ? 'index.html' : '');
            if (!file.startsWith(root + path.sep)) { res.writeHead(403).end(); return; }
            fs.readFile(file, (error, data) => {
              if (error) { res.writeHead(404).end(); return; }
              res.writeHead(200, {'Content-Type':types[path.extname(file)] || 'application/octet-stream'});
              res.end(req.method === 'HEAD' ? undefined : data);
            });
          }).listen(8768, '127.0.0.1');
          SERVER
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8768/volt-ui-kit/live/ > /dev/null && break; sleep 1; done
          export VOLT_WEB_URL=http://127.0.0.1:8768/volt-ui-kit
          NODE_PATH="$PWD/target/web-test-tools/node_modules" node scripts/test_web.cjs
          NODE_PATH="$PWD/target/web-test-tools/node_modules" node scripts/test_catalog_web.cjs
          NODE_PATH="$PWD/target/web-test-tools/node_modules" node scripts/test_web_input.cjs
          BROWSER_TESTS
      - name: Save build cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/wasm-bindgen
            target/
            crates/volt-ui-kit-web/target/
            examples/web/target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
