name: UI Kit CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      # Windows (DX12) and Linux (Vulkan) must at least build and pass headless
      # tests; native window/GPU runtime acceptance is still manual per platform.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Install native text test fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo package --locked
      - run: cargo run --locked --example gallery
      - run: cargo build --locked --features native --examples
      - run: cargo run --locked --features native --example complete_app -- --snapshot target/complete-app.png
      - run: cargo run --locked --features native --example rust_settings -- --snapshot target/rust-settings.png
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.87.0
      - run: cargo +1.87.0 check --locked --all-targets --all-features
