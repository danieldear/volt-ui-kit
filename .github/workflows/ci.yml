name: UI Kit CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 45
    strategy:
      # Windows (DX12) and Linux (Vulkan) must at least build and pass headless
      # tests; native window/GPU runtime acceptance is still manual per platform.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Line numbers without full debug info: smaller, quicker builds to cache.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      # Compiled dependencies and downloads from earlier runs on this branch
      # (or main). Saved again at the end, even when a later step fails.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: validate-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: validate-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: Install native text test fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Documentation builds without warnings
        shell: bash
        run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --all-features --no-deps
      - name: Each feature builds on its own
        shell: bash
        run: |
          for f in declarative rust-ui rendering rendering-gpu mobile native native-gpu native-desktop native-notifications dev-tools; do
            cargo check --locked --lib --no-default-features --features "$f"
          done
      - name: Core builds for WebAssembly
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --lib --target wasm32-unknown-unknown --features rust-ui
      - run: cargo package --locked
      - run: cargo run --locked --example gallery
      - run: cargo build --locked --features native --examples
      - name: Copied Catalog programs compile independently
        run: python3 scripts/check_sample_sources.py
      - run: cargo run --locked --features native --example complete_app -- --snapshot target/complete-app.png
      - run: cargo run --locked --features native --example rust_settings -- --snapshot target/rust-settings.png
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.89.0
      - run: cargo +1.89.0 check --locked --all-targets --all-features
      - name: Save build cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
