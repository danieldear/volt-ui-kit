[package]
name = "volt-web-catalog"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
volt-ui-kit = { path = "../..", features = ["rendering"] }
volt-ui-kit-web = { path = "../../crates/volt-ui-kit-web", features = ["gpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "console"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
