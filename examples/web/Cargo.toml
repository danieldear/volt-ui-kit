[package]
name = "volt-web-catalog"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
volt-ui-kit = { path = "../..", features = ["rendering"] }
volt-ui-kit-web = { path = "../../crates/volt-ui-kit-web", features = ["gpu"] }
# The maps app, shared with the desktop example: map styles are JSON, and
# vector tiles can arrive gzip-compressed.
serde_json = "=1.0.154"
flate2 = "=1.1.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "console", "Window", "Request", "RequestInit", "Response", "Headers"] }

[lints.rust]
# The shared maps code picks threads and MapKit with the kit's `native`
# feature on the desktop; this crate never sets it, so maps take the
# browser's path (the page fetches, frames drive timers).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("native"))'] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
